<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация</title>
  <link href="style.css" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="images/favicon.ico">
</head>
<body>
<header>
  <h1>Регистрация</h1>
</header>

<main>
  <div class="error-container" role="alert" hidden>
    <p id="error-message"></p>
  </div>

  <form id="register-form" class="student-card">
    <div class="form-row">
      <label for="username">
        Имя пользователя <span class="required">*</span>
      </label>
      <input
              type="text"
              id="username"
              name="username"
              autocomplete="username"
              minlength="3"
              maxlength="20"
              pattern="[a-zA-Z0-9]{3,20}"
              title="От 3 до 20 символов: латинские буквы и цифры"
              autocapitalize="none"
              spellcheck="false"
              required
      >
    </div>

    <div class="form-row">
      <label for="email">
        Email <span class="required">*</span>
      </label>
      <input
              type="email"
              id="email"
              name="email"
              autocomplete="email"
              maxlength="255"
              required
      >
    </div>

    <div class="form-row">
      <label for="password">
        Пароль <span class="required">*</span>
      </label>
      <input
              type="password"
              id="password"
              name="password"
              autocomplete="new-password"
              minlength="8"
              maxlength="100"
              pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[@$!%*?&amp;])[A-Za-z0-9@$!%*?&amp;]{8,100}"
              title="От 8 до 100 символов. Нужны строчная и заглавная латинские буквы, цифра и символ из @$!%*?&amp;. Другие символы не допускаются."
              required
      >
    </div>

    <div class="form-row">
      <label for="password-confirm">
        Повтор пароля <span class="required">*</span>
      </label>
      <input
              type="password"
              id="password-confirm"
              name="passwordConfirm"
              autocomplete="new-password"
              minlength="8"
              maxlength="100"
              required
      >
    </div>

    <div class="buttons-container">
      <button type="submit" class="buttons" id="accept-button">
        Зарегистрироваться
      </button>
      <a href="login.html" class="buttons">
        Уже есть аккаунт
      </a>
    </div>
  </form>
</main>

<script type="module" src="scripts/pages/register.js"></script>
</body>
</html>
