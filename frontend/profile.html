<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой профиль</title>
  <link href="style.css" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="images/favicon.ico">
</head>
<body>
<header>
  <h1>Мой профиль</h1>
</header>

<main>
  <div class="error-container" role="alert" hidden>
    <p id="error-message"></p>
  </div>

  <section id="profile-card" class="student-card" hidden>
    <dl>
      <div class="info-row">
        <dt>Имя пользователя</dt>
        <dd id="profile-username"></dd>
      </div>

      <div class="info-row">
        <dt>Email</dt>
        <dd id="profile-email"></dd>
      </div>

      <div class="info-row">
        <dt>Роль</dt>
        <dd id="profile-role"></dd>
      </div>
    </dl>
  </section>

  <div class="buttons-container">
    <a href="index.html" class="buttons">
      К списку студентов
    </a>
    <button type="button" class="buttons" id="delete-button">
      Выйти из аккаунта
    </button>
  </div>
</main>

<script type="module" src="scripts/pages/profile.js"></script>
</body>
</html>
