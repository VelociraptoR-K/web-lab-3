<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Досье студента</title>
    <link href="style.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
</head>
<body>
    <header>
        <h1>Досье студента</h1>
        <details id="user-menu" class="user-menu" hidden>
            <summary>
                <span aria-hidden="true">👤</span>
                <span id="menu-username"></span>
            </summary>

            <nav class="user-menu-actions" aria-label="Меню пользователя">
                <a href="profile.html" class="buttons">Мой профиль</a>
                <button type="button" class="buttons" id="logout-button">
                    Выйти
                </button>
            </nav>
        </details>
        <nav class="buttons-container">
            <a href="index.html" class="buttons">К списку студентов</a>
            <button class="buttons edit-button" data-admin-only hidden>Изменить данные</button>
        </nav>
    </header>
    <main>
        <div class="error-container" hidden>
            <p id="error-message"></p>
        </div>
        <div class="student-card">
            <h2 id="student-full-name">—</h2>
            <dl class="student-info">
                <div class="info-row">
                    <dt>Группа:</dt>
                    <dd id="group">—</dd>
                </div>
                <div class="info-row">
                    <dt>ИСУ id:</dt>
                    <dd id="isuId">—</dd>
                </div>
                <div class="info-row">
                    <dt>Номер общежития:</dt>
                    <dd id="dormitoryNumber">—</dd>
                </div>
                <div class="info-row">
                    <dt>Комната:</dt>
                    <dd id="room">—</dd>
                </div>
                <div class="info-row">
                    <dt>Срок заселения:</dt>
                    <dd id="moveInDate">—</dd>
                </div>
                <div class="info-row">
                    <dt>Иностранец:</dt>
                    <dd id="foreigner">—</dd>
                </div>
                <div class="info-row">
                    <dt>Заметки:</dt>
                    <dd id="notes">—</dd>
                </div>
            </dl>
        </div>
    </main>
    <script type="module" src="scripts/pages/student.js"></script>
    <script type="module" src="scripts/shared/userMenu.js"></script>
</body>
</html>
