services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRESQL_USER}
      POSTGRES_PASSWORD: ${POSTGRESQL_PASSWORD}
      POSTGRES_DB: ${POSTGRESQL_DATABASE}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      POSTGRESQL_URL: jdbc:postgresql://db:5432/${POSTGRESQL_DATABASE}
      JWT_SECRET_KEY_LOCATION: file:/app/secrets/jwt-secret.jwk
    volumes:
      - maven-cache:/root/.m2
      - ./backend/secrets/jwt-secret.jwk:/app/secrets/jwt-secret.jwk:ro
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy


  frontend:
    build: ./frontend
    ports:
      - "2000:2000"

volumes:
  postgres-data:
  maven-cache: