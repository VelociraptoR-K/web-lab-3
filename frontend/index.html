<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список студентов</title>
    <link href="style.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
</head>
<body>
    <header>
        <h1>Список студентов</h1>
        <details id="user-menu" class="user-menu" hidden>
            <summary>
                <span aria-hidden="true">👤</span>
                <span id="menu-username"></span>
            </summary>

            <nav class="user-menu-actions" aria-label="Меню пользователя">
                <a href="profile.html" class="buttons">Мой профиль</a>
                <button type="button" class="buttons" id="logout-button">
                    Выйти
                </button>
            </nav>
        </details>
    </header>
    <main>
        <div class="error-container" hidden>
            <p id="error-message"></p>
        </div>
        
        <details class="filter-panel">
        <summary class="filter-panel-toggle">Фильтры и сортировка</summary>
            <form id="students-query-form" class="query-panel">
                <fieldset class="filter-fields">
                    <legend>Фильтры студентов</legend>

                    <div class="filter-block">
                        <label class="filter-field">
                            <span>Фамилия</span>
                            <input type="search" name="surname" placeholder="Например, Иванов" minlength="2" maxlength="50" pattern="[\p{L}]+" oninvalid="this.setCustomValidity('Введите фамилию, без пробелов и других символов')" oninput="this.setCustomValidity('')">
                        </label>

                        <label class="filter-field">
                            <span>Имя</span>
                            <input type="search" name="name" placeholder="Например, Иван" minlength="2" maxlength="50" pattern="[\p{L}]+" oninvalid="this.setCustomValidity('Введите имя, без пробелов и других символов')" oninput="this.setCustomValidity('')">
                        </label>

                        <label class="filter-field">
                            <span>Отчество</span>
                            <input type="search" name="patronymic" placeholder="Например, Иванович" minlength="2" maxlength="50" pattern="[\p{L}]+" oninvalid="this.setCustomValidity('Введите отчество, без пробелов и других символов')" oninput="this.setCustomValidity('')">
                        </label>

                        <label class="filter-field">
                            <span>Группы — через запятую</span>
                            <input type="text" name="group" placeholder="Q1234, Q1235">
                        </label>

                        <label class="filter-field">
                            <span>Общежития — через запятую</span>
                            <input type="text" name="dormitoryNumber" inputmode="numeric" placeholder="8, 9">
                        </label>

                        <label class="filter-field">
                            <span>Комнаты — через запятую</span>
                            <input type="text" name="room" inputmode="numeric" placeholder="415, 416">
                        </label>

                        <label class="filter-field">
                            <span>Дата заселения от</span>
                            <input type="date" name="moveInDateFrom">
                        </label>

                        <label class="filter-field">
                            <span>Дата заселения до</span>
                            <input type="date" name="moveInDateTo">
                        </label>

                        <label class="filter-field">
                            <span>Иностранец</span>
                            <select name="foreigner">
                                <option value="">Любой</option>
                                <option value="true">Да</option>
                                <option value="false">Нет</option>
                            </select>
                        </label>
                    </div>
                </fieldset>

            <div class="sort-controls">
                <label class="filter-field">
                    <span>Сортировать по</span>
                    <select id="sortBy" name="sortBy">
                        <option value="id" selected>Номеру</option>
                        <option value="surname">Фамилии</option>
                        <option value="name">Имени</option>
                        <option value="patronymic">Отчеству</option>
                        <option value="group">Группе</option>
                        <option value="isuId">ИСУ ID</option>
                        <option value="dormitoryNumber">Общежитию</option>
                        <option value="room">Комнате</option>
                        <option value="moveInDate">Дате заселения</option>
                    </select>
                </label>

                <label class="filter-field">
                    <span>Порядок</span>
                    <select id="sort-order" name="order">
                        <option value="up">По возрастанию</option>
                        <option value="down">По убыванию</option>
                    </select>
                </label>

                <button type="submit" class="buttons">Применить</button>
                <button type="reset" class="buttons">Сбросить</button>
            </div>
            </form>
        </details>

        <div class="buttons-container">
            <a href="form.html" class="buttons" data-admin-only hidden>Добавить студента</a>
            <button class="buttons edit-button" disabled data-admin-only hidden>Редактировать студента</button>
            <button class="buttons info-button" disabled>Досье студента</button>
            <button class="buttons delete-button" id="delete-button" disabled data-admin-only hidden>Удалить студента</button>
        </div>

        <div class="table-container">
            <table class="table">
                <caption id="title-for-blind">Таблица зарегестрированных студентов</caption>
                <thead>
                    <tr>
                        <th>№</th>
                        <th>Фамилия</th>
                        <th>Имя</th>
                        <th>Отчество</th>
                        <th>Группа</th>
                        <th>ИСУ id</th>
                        <!--
                        <th>Номер общежития</th>
                        <th>Комната</th>
                        <th>Срок заселения</th>
                        <th>Иностранец</th>
                        <th>Заметки</th>
                        -->
                    </tr>
                </thead>
                <tbody id="table-body">
                </tbody>
            </table>
        </div>

        <nav class="pagination" aria-label="Страницы списка студентов">
            <button id="prev-page" class="buttons" type="button" disabled>
                Назад
            </button>

            <span id="page-info" aria-live="polite">Страница 1</span>

            <button id="next-page" class="buttons" type="button">
                Вперёд
            </button>
        </nav>

    </main>
    <script type="module" src="scripts/pages/index.js"></script>
    <script type="module" src="scripts/shared/userMenu.js"></script>
</body>
</html>
